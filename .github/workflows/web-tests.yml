name: Web tests

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/migrations/**"
      - ".github/workflows/web-tests.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "docs/migrations/**"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Auditorias informativas enquanto o legado existente e estabilizado.
      # Elas tornam regressões visiveis sem bloquear entregas por problemas
      # que ja existem na linha de base atual.
      - name: Lint audit (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Unit and route tests with coverage
        run: npm run test:coverage

      - name: Security and collaborator contracts
        run: npm run test:contracts

      - name: Production build audit (non-blocking)
        continue-on-error: true
        run: npm run build
